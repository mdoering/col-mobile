name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select latest Xcode
        run: |
          LATEST=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -n1)
          if [ -n "$LATEST" ]; then sudo xcode-select -s "$LATEST/Contents/Developer"; fi
          xcodebuild -version

      - name: Install XcodeGen
        run: brew list xcodegen &>/dev/null || brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Cache DerivedData
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: ${{ runner.os }}-deriveddata-${{ hashFiles('project.yml', 'CatalogueOfLife/**/*.swift', 'CatalogueOfLifeTests/**/*.swift') }}
          restore-keys: |
            ${{ runner.os }}-deriveddata-

      - name: Build & test
        run: |
          set -o pipefail
          # Pick any available iPhone simulator with iOS 18 or newer.
          DEVICE=$(xcrun simctl list devices available --json | python3 -c "
          import json,sys,re
          data = json.load(sys.stdin)
          for runtime, devs in data['devices'].items():
              # Prefix match ensures we only accept iOS (not tvOS/watchOS/etc.)
              # and the numeric version floor of 18 keeps us future-proof:
              #   'com.apple.CoreSimulator.SimRuntime.iOS-26-3' -> matches (26 >= 18)
              #   'com.apple.CoreSimulator.SimRuntime.tvOS-18-0' -> excluded (wrong prefix)
              #   'com.apple.CoreSimulator.SimRuntime.iOS-17-5'  -> excluded (17 < 18)
              m = re.search(r'iOS-(\d+)', runtime)
              if not runtime.startswith('com.apple.CoreSimulator.SimRuntime.iOS-') or not m or int(m.group(1)) < 18:
                  continue
              for d in devs:
                  if d.get('isAvailable') and d.get('name', '').startswith('iPhone'):
                      print(d['name']); sys.exit(0)
          ")
          if [ -z "$DEVICE" ]; then
            echo "ERROR: no available iPhone simulator with iOS 18+" >&2
            exit 1
          fi
          echo "Using simulator: ${DEVICE}"
          xcodebuild \
            -scheme CatalogueOfLife \
            -destination "platform=iOS Simulator,name=${DEVICE},OS=latest" \
            -enableCodeCoverage YES \
            test
        env:
          NSUnbufferedIO: YES
